x-backend: &backend
  build:
    context: .
  image: flamenco-studio-bot:local
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  bot:
    <<: *backend
    mem_limit: 256m
    pids_limit: 256
    env_file:
      - .env
    environment:
      ENV: production
      DATABASE_SSL_MODE: verify-full
      BOT_LOG_DIR: /var/log/flamenco
      STUDIO_TIMEZONE: ${STUDIO_TIMEZONE:-Europe/Moscow}
      # Heartbeat обновляется после каждой успешной проверки PostgreSQL
      # (раз в минуту); устаревший файл = зависший процесс или нет БД.
      BOT_HEARTBEAT_FILE: /tmp/flamenco-bot-heartbeat
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "python", "-m", "flamenco_bot.healthcheck", "bot"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    volumes:
      - bot_logs:/var/log/flamenco

  # Веб-API (src/flamenco_bot/api): тот же образ и код, что и бот, другая
  # команда запуска. Не публикует порт на хост — доступен только контейнеру
  # сайта (отдельный проект WEBSITE, свой compose.yaml) по имени
  # сервиса `api` в общей docker-сети `flamenco-web` (см. networks ниже).
  # Сайт проксирует к нему /api/* (next.config.ts сайта), так что у системы
  # остаётся одна публичная точка входа.
  api:
    <<: *backend
    mem_limit: 384m
    pids_limit: 256
    command: ["python", "-m", "flamenco_bot.api"]
    env_file:
      - .env
    environment:
      ENV: production
      DATABASE_SSL_MODE: verify-full
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      STUDIO_TIMEZONE: ${STUDIO_TIMEZONE:-Europe/Moscow}
      # Rate limit входа считает попытки по IP клиента. X-Forwarded-For
      # принимается только от контейнера сайта (frontend) — он передаёт
      # заголовок, который записал edge-прокси (docs/deployment.md). Один
      # адрес, не "*" и не вся сеть. Должен совпадать с ipv4_address
      # frontend в compose.yaml сайта.
      FORWARDED_ALLOW_IPS: ${FLAMENCO_FRONTEND_IP:-10.89.250.10}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    # 200 от /api/health = процесс отвечает и PostgreSQL доступна (иначе 503).
    healthcheck:
      test: ["CMD", "python", "-m", "flamenco_bot.healthcheck", "api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "8000"
    networks:
      - default
      - web

volumes:
  bot_logs:

networks:
  # Общая сеть с compose-проектом сайта: сайт подключается к ней как
  # external и обращается к API по http://api:8000. Имя фиксированное
  # (без префикса проекта), поэтому backend нужно поднять первым — он и
  # создаёт сеть.
  web:
    name: flamenco-web
    # Фиксированная подсеть — чтобы у frontend был постоянный адрес, которому
    # доверяет api (FORWARDED_ALLOW_IPS выше). Если подсеть пересекается с
    # уже существующей на хосте, задайте FLAMENCO_WEB_SUBNET и
    # FLAMENCO_FRONTEND_IP одинаково для обоих compose-проектов.
    ipam:
      config:
        - subnet: ${FLAMENCO_WEB_SUBNET:-10.89.250.0/24}
