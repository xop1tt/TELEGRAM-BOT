[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flamenco-studio-bot"
version = "0.1.0"
description = "Telegram bot for a flamenco studio"
requires-python = ">=3.10"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp==3.14.5",
    "asyncpg==0.32.0",
    "fastapi==0.143.0",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
# Делает запуск тестов независимым от editable-install `.pth` в site-packages:
# на macOS с синхронизацией iCloud Drive (Desktop/Documents) эти `.pth`-файлы
# периодически помечаются системой как "hidden" (chflags), из-за чего
# `site.py` их пропускает и `import flamenco_bot` падает — не ошибка кода.
pythonpath = ["src"]
